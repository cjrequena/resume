# Jobs
- company: TUI
  position: Solutions Architect
  duration: Jan, 2017 &mdash; Present
  summary: >
    Define architecture strategy for global sourcing and integration platforms, own the reference architecture and
    reference implementation needed to sustain the business, and evolve software development standards, security
    standards and process improvement efforts &mdash; with a focus on new and innovative technologies. Lead the
    evolution of enterprise and domain-level architectures, ensuring alignment with business objectives, scalability,
    and performance goals.

    <ul class="resume-item-list">
    <li>Defined architecture strategy for global sourcing and integration platforms supporting multi-regional travel operations, sizing the platform for high-demand seasonal workloads and setting the scalability and resilience targets the delivery teams build against</li>
    <li>Led the decomposition of monolithic applications into AWS-native microservices with event-driven integration &mdash; defining service boundaries, ownership model, deployment topology, and automated release paths &mdash; reducing deployment time by 60% and improving engineering delivery throughput</li>
    <li>Architected high-availability distributed systems achieving 99.99% uptime and improving peak-load scalability by 40% across business-critical services</li>
    <li>Established architecture governance practices &mdash; design reviews, architecture standards, reusable integration patterns, and engineering best practices &mdash; adopted across multiple global teams</li>
    <li>Influenced technical direction across Product, Engineering, Security, and DevOps organizations, translating enterprise strategy into concrete platform decisions and making the operational and security implications of those decisions explicit to non-technical stakeholders</li>
    <li>Established asynchronous messaging standards on Kafka and SNS/SQS &mdash; event contracts, consumer isolation, failure handling, and replay &mdash; removing synchronous coupling between domains, improving resilience and scalability, and containing the blast radius of downstream outages</li>
    <li>Defined API and integration strategy for platform services, standardizing REST contracts, versioning, and backward-compatibility rules so consuming teams could evolve independently of provider release cycles</li>
    <li>Maintained enterprise architecture documentation and application landscape governance using LeanIX, improving transparency, dependency visibility, and alignment across IT domains</li>
    <li>Evaluated architectural trade-offs, scalability risks, and long-term platform evolution strategies &mdash; including cost, operability, and migration effort &mdash; to support sustainable business growth</li>
    <li>Mentored engineers and architects through design reviews, pairing on architectural decisions, and written guidance, contributing to technical leadership development across teams</li>
    </ul>

    <strong>Environment:</strong> AWS &bull; Kafka &bull; SNS/SQS &bull; Java &bull; Spring Boot &bull; REST APIs &bull; Microservices &bull; Distributed Systems &bull; CI/CD &bull; LeanIX

