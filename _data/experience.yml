- company: TUI
  position: Solutions Architect
  duration: Jan, 2017 &mdash; Present
  summary: >
    <ul class="resume-item-list">
    <li>Defined architecture strategy for the global sourcing and integration platforms behind multi-regional travel operations, sizing for high-demand seasonal workloads and setting the scalability and resilience targets delivery teams build against &mdash; 99.99% uptime and a 40% improvement in peak-load scalability across business-critical services</li>
    <li>Led the decomposition of a monolithic booking platform into a set of independently deployable, reactive Java/Spring Boot services with event-driven integration &mdash; service boundaries, ownership model, deployment topology, and automated release paths &mdash; cutting deployment time by 60% and improving delivery throughput, while consolidating over a dozen regional brand storefronts onto a single whitelabel frontend</li>
    <li>Established asynchronous messaging standards on Kafka and SNS/SQS &mdash; event contracts, consumer isolation, failure handling, and replay &mdash; removing synchronous coupling between domains and containing the blast radius of downstream outages; applied this to federate real-time availability search across multiple external and internal suppliers, streaming results to clients as they arrive rather than blocking on the slowest supplier</li>
    <li>Introduced CQRS as the persistence model for the ancillary booking-lifecycle domain &mdash; an independently scaled command service handling writes and a query service serving reads from a document store, with domain events typed and versioned through a dedicated schema registry and AsyncAPI contracts &mdash; letting read and write paths scale independently while keeping downstream consumers aligned on event shape across versions</li>
    <li>Owned architecture governance adopted across multiple global teams: design reviews, security and development standards, reusable integration patterns, and versioned REST contracts with backward-compatibility rules that let consuming teams evolve independently of provider release cycles &mdash; with the application landscape and its dependencies tracked in LeanIX</li>
    <li>Defined the API gateway strategy for externally consumed services on Apigee &mdash; OAuth2 token verification and CORS policy standardized across the proxy layer so internal services never expose public endpoints directly &mdash; and led the phased migration of the proxy estate from Apigee Edge to Apigee X across test, pre-prod, and production for consumers spanning partner integrations and the mobile app team</li>
    <li>Influenced technical direction across Product, Engineering, Security, and DevOps, translating enterprise strategy into concrete platform decisions and making their operational and security implications explicit to non-technical stakeholders</li>
    <li>Mentored engineers and architects through design reviews, pairing on architectural decisions, and written guidance</li>
    </ul>

    <strong>Environment:</strong> Java 17/21 &bull; Spring Boot 3.x (WebFlux) &bull; AWS ECS Fargate &bull; RDS PostgreSQL &bull; DocumentDB &bull; MSK / Apache Kafka &bull; SNS/SQS &bull; Cognito &bull; Apigee (Edge &rarr; X migration) &bull; Terraform &bull; GitLab CI &bull; REST APIs &bull; LeanIX

